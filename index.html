<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>AG | Carte de visite</title>
    <link rel="stylesheet" href="carte_de_visite.css">
</head>

<body>
    <main class="page-layout">
        <article class="business-card" aria-label="Carte de visite GitHub d'Aurélien Georges">
            <section class="glass-subcard stats-card" aria-label="Statistiques GitHub">
                <article class="stat-group">
                    <span id="github-followers" class="stat-value">--</span>
                    <span class="stat-label">Followers</span>
                </article>
                <article class="stat-group">
                    <span id="github-following" class="stat-value">--</span>
                    <span class="stat-label">Following</span>
                </article>
                <article class="stat-group">
                    <span id="github-my-stars" class="stat-value">--</span>
                    <span class="stat-label">Stars</span>
                </article>
            </section>

            <section class="glass-subcard profile-card" aria-label="Profil">
                <p class="profile-name" id="github-login">Chargement du profil...</p>
                <p class="profile-detail" id="github-bio">Chargement de la biographie...</p>
                <p class="profile-detail" id="github-entreprise">Chargement de l'entreprise...</p>
            </section>

            <section class="glass-subcard repositories-card" aria-labelledby="repositories-title">
                <h1 id="repositories-title">Dépôts récents</h1>
                <ol id="github-unified-list" class="repository-list" aria-live="polite"></ol>
            </section>
        </article>
    </main>

    <script src="carte_de_visite.js"></script>
</body>

</html>
